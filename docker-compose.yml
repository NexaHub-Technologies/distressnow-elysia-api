services:
  postgres:
    image: postgres:16-alpine
    container_name: distressnow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: distressnow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # The API probes Postgres once at boot and silently falls back to
    # in-memory stores when unreachable — never let it start first.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d distressnow"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    image: oven/bun:1
    container_name: distressnow-api
    restart: unless-stopped
    working_dir: /app
    command: bun run --watch src/index.ts
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/distressnow
      PORT: 3000
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - .:/app

volumes:
  pgdata:
